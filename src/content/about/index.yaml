heading:
  eyebrow: About DOERs
  title: Who we are
  description: Dalumpinas Oeste Eco Rangers (DOERs) is a non profit organization dedicated in ensuring the cleanliness of our roads and beaches, protecting sea turtle nests & hatchlings, conducting feeding programs, tree planting & parenting, blood drives and medical missions.
organizationEyebrow: Our organization
organizationTitle: DOERS
