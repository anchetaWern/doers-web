principles:
  - letter: D
    text: Dedicated and commitedly conducting regular ridge to reef activities such as coastal cleanup, plogging, tree planting and parenting
  - letter: O
    text: Obediently observe laws and practices on Pawikan Conservation
  - letter: E
    text: Excellently disseminate and inform community on global environmental challenges and awareness
  - letter: R
    text: Responsibly build local and international linkages; and
  - letter: S
    text: Sustainably and efficiently develop, manage and assess projects, programs and activities, resources on environmental conservation and protection
visionMissionEyebrow: Our direction
visionMissionTitle: Vision and Mission
vision: The Dalumpinas Oeste Eco Rangers (DOERs) as steward of Mother Earth envisions a sustained green and safe environment and community.
mission: Conserve and preserve the environment by promoting awareness and building linkages not only in the local but also in the international stage.
